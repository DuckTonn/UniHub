name: Publish UniHub release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unihub-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      COMPOSE_PROJECT_NAME: unihub-release-ci
      VITE_TELEGRAM_BOT: ${{ vars.VITE_TELEGRAM_BOT }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require successful main CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f branch=main -f event=push -f status=success \
            --jq '.workflow_runs[0].id // empty')"
          test -n "$run_id"
          echo "CI run $run_id verified."
          echo "UNIHUB_ENV_FILE=$RUNNER_TEMP/release-test.env" >> "$GITHUB_ENV"
      - run: bash .github/ci/stack.sh start
      - run: bash .github/ci/stack.sh smoke
      - name: Publish the rehearsed images and record their digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          bash .github/ci/push_images.sh "ghcr.io/${GITHUB_REPOSITORY,,}" "$GITHUB_SHA" "$GITHUB_SHA" release.json
          python ops/release.py --project "$COMPOSE_PROJECT_NAME" --env-file "$UNIHUB_ENV_FILE" \
            --manifest release.json --monitoring --check
      - uses: actions/upload-artifact@v6
        with:
          name: unihub-release-${{ github.sha }}
          path: release.json
          if-no-files-found: error
      - name: Tear down disposable test stack
        if: always() && env.UNIHUB_ENV_FILE != ''
        run: bash .github/ci/stack.sh down
