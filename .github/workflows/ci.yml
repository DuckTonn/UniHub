name: UniHub CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Record advisory reports
        run: |
          mkdir audit
          npm --prefix frontend audit --omit=dev --json > audit/npm.json || test "$?" = 1
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r ai-service/requirements.txt --strict --format json --output audit/python.json || test "$?" = 1
          python - <<'PY'
          import json
          from pathlib import Path
          npm = json.loads(Path("audit/npm.json").read_text())
          python = json.loads(Path("audit/python.json").read_text())
          severity = npm["metadata"]["vulnerabilities"]
          print("npm advisories by severity:", severity)
          print("Python advisory count:", sum(len(package["vulns"]) for package in python["dependencies"]))
          if severity["high"] or severity["critical"]:
              raise SystemExit("High or critical npm production advisories must be addressed before release")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dependency-audit
          path: audit/

  spring:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: unihub
          POSTGRES_USER: unihub
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unihub -d unihub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: phase2-ci
          RABBITMQ_DEFAULT_PASS: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5672:5672
        options: >-
          --health-cmd "su-exec rabbitmq rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DB_URL: jdbc:postgresql://localhost:5432/unihub
      DB_USERNAME: unihub
      RUN_NOTIFICATION_OUTBOX_IT: "true"
      RABBITMQ_USER: phase2-ci
      RABBITMQ_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
      NOTIFICATION_EMAIL_ENABLED: "false"
      NOTIFICATION_TELEGRAM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            gateway/pom.xml
      - run: mvn -B -ntp -f gateway/pom.xml verify
      - run: mvn -B -ntp -f backend/pom.xml verify

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@138b5fb1cf087fdb4c5f3c621466fe304d0cf2e3 # v4.0.3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          log-accepted-android-sdk-licenses: "false"
      - run: bash gradlew --no-daemon testDockerLocalDebugUnitTest assembleDockerLocalDebug

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: unihub-phase6-ci
    steps:
      - uses: actions/checkout@v5
      - name: Set isolated test paths
        run: |
          echo "UNIHUB_ENV_FILE=$RUNNER_TEMP/unihub-phase6.env" >> "$GITHUB_ENV"
          echo "UNIHUB_RELEASE_DRILL=$RUNNER_TEMP/unihub-release-drill" >> "$GITHUB_ENV"
      - run: bash .github/ci/stack.sh start
      - run: bash .github/ci/stack.sh smoke
      - run: bash .github/ci/stack.sh operations
      - run: bash .github/ci/release_drill.sh
      - name: Show container logs on failure
        if: failure()
        run: bash .github/ci/stack.sh logs
      - name: Tear down test stack
        if: always()
        run: bash .github/ci/stack.sh down
