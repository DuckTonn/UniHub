services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: unihub
      POSTGRES_USER: unihub
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set a disposable database password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unihub -d unihub"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cache

  backend:
    depends_on:
      postgres:
        condition: service_healthy
