log_format unihub escape=json '{"request_id":"$request_id","method":"$request_method",'
                             '"status":$status,"duration_seconds":$request_time}';

server {
    listen 80;
    server_name localhost;
    set_real_ip_from ${UNIHUB_TRUSTED_TLS_PROXY};
    real_ip_header X-Forwarded-For;

    client_max_body_size 20M;
    access_log /var/log/nginx/access.log unihub;
    add_header X-Request-ID $request_id always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location ~ ^/(actuator|metrics|health|summarize)(/|$) {
        return 404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Refresh Docker DNS after gateway containers are replaced.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream gateway:8081;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
    }
}
