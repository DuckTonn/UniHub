global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [alerts.yml]

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [gateway:9081]
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:9080]
  - job_name: ai
    static_configs:
      - targets: [ai-service:8000]
